[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C90", "PL"]
ignore = ["UP042"]  # se evita StrEnum para admitir Python 3.10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
